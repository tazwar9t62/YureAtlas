name: yureatlas
services:
  db:
    build: ./infra/db
    environment:
      POSTGRES_DB: yureatlas
      POSTGRES_USER: yureatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yureatlas_local}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yureatlas -d yureatlas"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: &python-env
      DATABASE_URL: postgresql+psycopg://yureatlas:${POSTGRES_PASSWORD:-yureatlas_local}@db:5432/yureatlas
      ARTIFACT_DIR: /data/artifacts
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      HISTORY_START: ${HISTORY_START:-2015-01-01}
      SCHEDULE_ENABLED: ${SCHEDULE_ENABLED:-true}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    depends_on:
      db: {condition: service_healthy}
    volumes: ["artifacts:/data/artifacts"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "yureatlas.worker"]
    environment: *python-env
    depends_on:
      db: {condition: service_healthy}
    volumes: ["artifacts:/data/artifacts"]
    restart: unless-stopped
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
volumes:
  database:
  artifacts:
